# Anaconda configuration for the DoxIA installer, picked with inst.profile=doxia
# (build.sh adds it to the boot menu). Everything else comes from Fedora's profile.

[Profile]
profile_id = doxia
base_profile = fedora

[Profile Detection]
os_id = doxia

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/doxia/doxia.css
