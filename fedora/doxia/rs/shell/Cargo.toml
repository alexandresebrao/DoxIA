[package]
name = "doxia-shell"
description = "The DoxIA shell daemon: layer-shell surfaces (OSD first) replacing Quickshell piece by piece"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gtk.workspace = true
serde_json.workspace = true
doxia-theme.workspace = true
gtk4-layer-shell = "0.8"
gio-unix = "0.22"
pangocairo = "0.22"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
glib-unix = "0.22"
libc = "0.2"
