<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Só no Quickshell (barra, painéis, menus), o monospace vira a DoxIA Shell:
     a mesma fonte com os ícones Nerd Font redesenhados com o Lucide
     (fedora/doxia/lucide/make-shell-font). Terminais e o resto não mudam.
     "assign" troca o monospace no lugar: a regra do omarchy-font-set
     (~/.config/fontconfig/fonts.conf, prepend_first) roda depois e só age
     sobre monospace, então não passa a JetBrainsMono na frente. -->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DoxIA Shell</string></edit>
  </match>
</fontconfig>
