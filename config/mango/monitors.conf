# Monitors. List outputs and their modes with: wlr-randr
# Without a rule, every monitor uses its preferred mode at scale 1.

# Configure a specific monitor (name is a regex: anchor it for an exact match).
# monitor_rule=name:^DP-2$,width:2560,height:1440,refresh:144,x:0,y:0,scale:1

# Portrait secondary monitor (rr: 1 = 90°, 3 = 270°).
# monitor_rule=name:^DP-2$,width:2560,height:1440,refresh:60,x:2560,y:0,scale:1,rr:1
