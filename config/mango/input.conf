# Keyboard layout and input overrides.
# See https://github.com/mangowm/mango/blob/main/docs/configuration/input.md

# Several layouts, switched with Left Alt + Right Alt.
# xkb_rules_layout=us,dk
# xkb_rules_options=compose:caps,grp:alts_toggle

# International variant.
# xkb_rules_variant=intl

# Key repeat.
# repeat_rate=40
# repeat_delay=250

# Mouse speed (-1.0 to 1.0) and flat acceleration.
# mouse_accel_speed=0.35
# mouse_accel_profile=1

# Touchpad speed (-1.0 to 1.0) and flat acceleration.
# trackpad_accel_speed=0.35
# trackpad_accel_profile=1

# Natural scrolling on the touchpad.
# trackpad_natural_scrolling=1
