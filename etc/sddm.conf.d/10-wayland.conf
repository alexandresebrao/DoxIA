[General]
DisplayServer=wayland
# Software Qt Quick hands mango shm buffers. On VMware's vmwgfx, wlroots rejects
# the greeter's GL dmabufs ("Failed to close buffer handle"), Qt dies with a
# protocol error and the login screen stays black with only the cursor.
# The theme has no shader effects, so nothing is lost on real GPUs either.
GreeterEnvironment=QT_QUICK_BACKEND=software

[Wayland]
CompositorCommand=/usr/libexec/doxia-sddm-greeter
