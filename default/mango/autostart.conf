# Session start. mango has already pushed WAYLAND_DISPLAY and
# XDG_CURRENT_DESKTOP to systemd/dbus, so units started here see them.

# Tell uwsm the compositor is up: it exports WAYLAND_DISPLAY and friends to
# the systemd session and lets graphical-session.target start.
exec_once=uwsm finalize

# Slow app launch fix: hand the full session env to systemd and dbus.
exec_once=sh -c 'systemctl --user import-environment $(env | cut -d= -f1); dbus-update-activation-environment --systemd --all'

# Finish starting the keyring the login unlocked (pam_gnome_keyring).
exec_once=gnome-keyring-daemon --start --components=secrets

# The DoxIA shell daemon (fedora/doxia/doxia-shell.service; it skips itself
# where install-rs didn't put doxia-shell in place).
exec_once=systemctl --user start doxia-shell.service
exec_once=omarchy-powerprofiles-init
exec_once=uwsm-app -- omarchy-mango-monitor-watch
exec_once=uwsm-app -- udiskie --automount --no-notify --no-tray

# Lock the screen before suspend (on Arch, Omarchy enables this unit globally).
exec_once=systemctl --user start omarchy-sleep-lock.service

# DoxIA: finish the installation on the first login (exits at once afterwards).
exec_once=sh -c 'exec "$OMARCHY_PATH/fedora/doxia/first-boot"'

# Run post-boot hooks after startup config has loaded.
exec_once=sh -c 'sleep 2 && omarchy-hook post-boot'
