# Look and feel. See https://github.com/mangowm/mango/tree/main/docs/visuals

# Borders and gaps.
border_px=2
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
border_radius=0
no_radius_when_single=0

# Colors (the theme's mango.conf overrides focus_color/border_color).
root_color=0x000000ff
border_color=0x595959aa
focus_color=0x33ccffee
urgent_color=0xad401fff
maximized_screen_color=0x33ccffee
scratchpad_color=0x33ccffee
global_color=0x33ccffee
overlay_color=0x33ccffee

# Effects stay off: they need a real GPU and Omarchy keeps windows flat.
blur=0
blur_layer=0
shadows=0
layer_shadows=0

# Opacity for every window (apps/*.conf opt media and browsers out).
focused_opacity=0.985
unfocused_opacity=0.96

# mango's own animations (/etc/mango/config.conf): workspace switches slide
# horizontally, windows slide and fade in and out.
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Layouts. Ten tags, matching the 1..0 number row.
tag_num=10
tag_rule=id:*,layout_name:dwindle
circle_layout=dwindle,scroller

dwindle_preserve_split=1
dwindle_horizontal_split=1
dwindle_vertical_split=1

scroller_default_proportion=0.49
scroller_proportion_preset=0.49,0.97
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=0

# Monocle/deck tabs and window groups.
monocle_tab_mode=1
group_bar_height=22
group_bar_decorate_font_desc=monospace 12
tab_bar_height=22
tab_bar_decorate_font_desc=monospace 12

# Focus and behaviour.
focus_on_activate=1
sloppy_focus=1
warp_cursor=0
cursor_hide_on_keypress=1
cursor_size=24
enable_floating_snap=1
drag_tile_to_tile=1
idle_inhibit_when_fullscreen=0
view_current_to_back=0
