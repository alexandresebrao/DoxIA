# Hyper-V: hyperv_drm prefers 1024x768, which comes up blurry. omarchy-mango-session
# links this in only on Hyper-V and only while ~/.config/mango/monitors.conf has no
# monitor_rule of its own, so a VM moved to another hypervisor, or a rule of yours,
# is left alone.
monitor_rule=name:.*,width:1280,height:720,refresh:60,x:0,y:0,scale:1
