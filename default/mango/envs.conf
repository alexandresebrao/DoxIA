# Session environment. mango resets these on every config reload.

# Cursor size.
env=XCURSOR_SIZE,24

# Force all apps to use Wayland.
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,gtk3
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland
env=XDG_SESSION_TYPE,wayland

# Screen sharing portals pick their backends by desktop name.
env=XDG_CURRENT_DESKTOP,mango:wlroots
env=XDG_SESSION_DESKTOP,mango

# Java/Swing apps (IntelliJ, PyCharm) draw blank windows under a non-reparenting WM.
env=_JAVA_AWT_WM_NONREPARENTING,1
