# Window management. Keys 1..0 are code:10..19 so they work on any layout;
# code:20/21 are the -/= keys.

# Close window
bind=SUPER,W,killclient
# Close all windows
bind=CTRL+ALT,Delete,spawn,omarchy-mango-window-close-all

# Toggle window split
bind=SUPER,J,dwindle_toggle_split_direction
# Toggle window floating/tiling
bind=SUPER,T,togglefloating
# Full screen
bind=SUPER,F,togglefullscreen
# Tiled full screen
bind=SUPER+CTRL,F,togglefakefullscreen
# Full width
bind=SUPER+ALT,F,togglemaximizescreen
# Pop window out (float & pin)
bind=SUPER,O,spawn,omarchy-mango-window-pop
# Toggle workspace layout
bind=SUPER,L,switch_layout

# Focus on left window
bind=SUPER,Left,focusdir,left
# Focus on right window
bind=SUPER,Right,focusdir,right
# Focus on above window
bind=SUPER,Up,focusdir,up
# Focus on below window
bind=SUPER,Down,focusdir,down

# Switch to workspace 1
bind=SUPER,code:10,view,1
# Move window to workspace 1
bind=SUPER+SHIFT,code:10,tag,1
# Move window silently to workspace 1
bind=SUPER+SHIFT+ALT,code:10,tagsilent,1
# Switch to workspace 2
bind=SUPER,code:11,view,2
# Move window to workspace 2
bind=SUPER+SHIFT,code:11,tag,2
# Move window silently to workspace 2
bind=SUPER+SHIFT+ALT,code:11,tagsilent,2
# Switch to workspace 3
bind=SUPER,code:12,view,3
# Move window to workspace 3
bind=SUPER+SHIFT,code:12,tag,3
# Move window silently to workspace 3
bind=SUPER+SHIFT+ALT,code:12,tagsilent,3
# Switch to workspace 4
bind=SUPER,code:13,view,4
# Move window to workspace 4
bind=SUPER+SHIFT,code:13,tag,4
# Move window silently to workspace 4
bind=SUPER+SHIFT+ALT,code:13,tagsilent,4
# Switch to workspace 5
bind=SUPER,code:14,view,5
# Move window to workspace 5
bind=SUPER+SHIFT,code:14,tag,5
# Move window silently to workspace 5
bind=SUPER+SHIFT+ALT,code:14,tagsilent,5
# Switch to workspace 6
bind=SUPER,code:15,view,6
# Move window to workspace 6
bind=SUPER+SHIFT,code:15,tag,6
# Move window silently to workspace 6
bind=SUPER+SHIFT+ALT,code:15,tagsilent,6
# Switch to workspace 7
bind=SUPER,code:16,view,7
# Move window to workspace 7
bind=SUPER+SHIFT,code:16,tag,7
# Move window silently to workspace 7
bind=SUPER+SHIFT+ALT,code:16,tagsilent,7
# Switch to workspace 8
bind=SUPER,code:17,view,8
# Move window to workspace 8
bind=SUPER+SHIFT,code:17,tag,8
# Move window silently to workspace 8
bind=SUPER+SHIFT+ALT,code:17,tagsilent,8
# Switch to workspace 9
bind=SUPER,code:18,view,9
# Move window to workspace 9
bind=SUPER+SHIFT,code:18,tag,9
# Move window silently to workspace 9
bind=SUPER+SHIFT+ALT,code:18,tagsilent,9
# Switch to workspace 10
bind=SUPER,code:19,view,10
# Move window to workspace 10
bind=SUPER+SHIFT,code:19,tag,10
# Move window silently to workspace 10
bind=SUPER+SHIFT+ALT,code:19,tagsilent,10

# Toggle scratchpad
bind=SUPER,S,toggle_special_tag
# Move window to scratchpad
bind=SUPER+ALT,S,tag_special_silent

# Next workspace
bind=SUPER,Tab,viewtoright_have_client
# Previous workspace
bind=SUPER+SHIFT,Tab,viewtoleft_have_client
# Former workspace
bind=SUPER+CTRL,Tab,view,-1
# Overview of all windows
bind=SUPER+CTRL+ALT,Tab,toggleoverview

# Move window to left monitor
bind=SUPER+SHIFT+ALT,Left,tagmon,left
# Move window to right monitor
bind=SUPER+SHIFT+ALT,Right,tagmon,right
# Move window to up monitor
bind=SUPER+SHIFT+ALT,Up,tagmon,up
# Move window to down monitor
bind=SUPER+SHIFT+ALT,Down,tagmon,down

# Swap window to the left
bind=SUPER+SHIFT,Left,exchange_client,left
# Swap window to the right
bind=SUPER+SHIFT,Right,exchange_client,right
# Swap window up
bind=SUPER+SHIFT,Up,exchange_client,up
# Swap window down
bind=SUPER+SHIFT,Down,exchange_client,down

# Switch to next window
bind=ALT,Tab,switcher,next
# Switch to previous window
bind=ALT+SHIFT,Tab,switcher,prev

# Focus on next monitor
bind=CTRL+ALT,Tab,focusmon,next
# Focus on previous monitor
bind=CTRL+ALT+SHIFT,Tab,focusmon,prev

# Expand window left
bind=SUPER,code:20,resizewin,-100,+0
# Shrink window left
bind=SUPER,code:21,resizewin,+100,+0
# Shrink window up
bind=SUPER+SHIFT,code:20,resizewin,+0,-100
# Expand window down
bind=SUPER+SHIFT,code:21,resizewin,+0,+100
# Expand window left a little
bind=SUPER+ALT,code:20,resizewin,-25,+0
# Shrink window left a little
bind=SUPER+ALT,code:21,resizewin,+25,+0
# Shrink window up a little
bind=SUPER+SHIFT+ALT,code:20,resizewin,+0,-25
# Expand window down a little
bind=SUPER+SHIFT+ALT,code:21,resizewin,+0,+25
# Expand window left a lot
bind=SUPER+CTRL,code:20,resizewin,-300,+0
# Shrink window left a lot
bind=SUPER+CTRL,code:21,resizewin,+300,+0
# Shrink window up a lot
bind=SUPER+CTRL+SHIFT,code:20,resizewin,+0,-300
# Expand window down a lot
bind=SUPER+CTRL+SHIFT,code:21,resizewin,+0,+300

# Scroll: windows on the scroller layout, workspaces otherwise, the bar over the bar
axisbind=SUPER,DOWN,spawn,omarchy-mango-scroll-focus next
axisbind=SUPER,UP,spawn,omarchy-mango-scroll-focus prev
axisbind=SUPER,RIGHT,spawn,omarchy-mango-scroll-focus next
axisbind=SUPER,LEFT,spawn,omarchy-mango-scroll-focus prev

# Move window
mousebind=SUPER,btn_left,moveresize,curmove
# Resize window
mousebind=SUPER,btn_right,moveresize,curresize

# Three-finger swipes move focus sideways.
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
# Four-finger swipes change workspace.
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# Join group on the left
bind=SUPER+ALT,Left,groupjoin,left
# Join group on the right
bind=SUPER+ALT,Right,groupjoin,right
# Join group above
bind=SUPER+ALT,Up,groupjoin,up
# Join group below
bind=SUPER+ALT,Down,groupjoin,down
# Move active window out of group
bind=SUPER+ALT,G,groupleave
# Next window in group
bind=SUPER+ALT,Tab,groupfocus,next
# Previous window in group
bind=SUPER+ALT+SHIFT,Tab,groupfocus,prev
# Move grouped window focus left
bind=SUPER+CTRL,Left,groupfocus,prev
# Move grouped window focus right
bind=SUPER+CTRL,Right,groupfocus,next

# Monitor scaling up
bind=SUPER,slash,spawn,omarchy-mango-monitor-scaling up
# Monitor scaling down
bind=SUPER+ALT,slash,spawn,omarchy-mango-monitor-scaling down
