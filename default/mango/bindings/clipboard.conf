# Universal clipboard: SUPER+C/V/X send the app's own shortcut (terminals get
# CTRL/SHIFT+Insert). Fired on key release so the held SUPER is already gone.

# Universal copy
bindr=SUPER,C,spawn,omarchy-mango-send-shortcut copy
# Universal paste
bindr=SUPER,V,spawn,omarchy-mango-send-shortcut paste
# Universal cut
bindr=SUPER,X,spawn,omarchy-mango-send-shortcut cut
# Clipboard manager
bind=SUPER+CTRL,V,spawn,omarchy-shell shell toggle omarchy.clipboard
