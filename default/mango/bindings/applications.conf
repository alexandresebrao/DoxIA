# Essential application bindings.

# Terminal
bind=SUPER,Return,spawn,omarchy-launch-terminal
# Browser
bind=SUPER+SHIFT,Return,spawn,omarchy-launch-browser
# File manager
bind=SUPER+SHIFT,F,spawn,omarchy-launch-nautilus
# File manager (cwd)
bind=SUPER+ALT+SHIFT,F,spawn,omarchy-launch-nautilus-cwd
# Browser
bind=SUPER+SHIFT,B,spawn,omarchy-launch-browser
# Browser (private)
bind=SUPER+SHIFT+ALT,B,spawn,omarchy-launch-browser --private
# Editor
bind=SUPER+SHIFT,N,spawn,omarchy-launch-editor
# Painel Rápido
bind=SUPER+ALT,P,spawn,doxia-painel --favorito
