# Menus, toggles, captures, notifications and panels.

# Omarchy menu
bind=SUPER,space,spawn,omarchy-menu toggle
# Iniciar
bind=SUPER+ALT,space,spawn,omarchy-shell shell toggle doxia.iniciar
# Emojis
bind=SUPER+CTRL,E,spawn,omarchy-shell shell toggle doxia.emojis
# Capture menu
bind=SUPER+CTRL,C,spawn,omarchy-menu toggle capture
# Toggle menu
bind=SUPER+CTRL,O,spawn,omarchy-menu toggle toggle
# Hardware menu
bind=SUPER+CTRL,H,spawn,omarchy-menu toggle hardware
# Omarchy menu
bind=SUPER+SHIFT,code:201,spawn,omarchy-menu toggle root
# System menu
bind=SUPER,Escape,spawn,omarchy-menu toggle system
# Power menu
bindl=NONE,XF86PowerOff,spawn,omarchy-menu toggle system
# Keybindings
bind=SUPER,K,spawn,omarchy-menu-keybindings
# Tmux keybindings
bind=SUPER+ALT,K,spawn,omarchy-menu-tmux-keybindings
# Herdr keybindings
bind=SUPER+CTRL,K,spawn,omarchy-menu-herdr-keybindings
# Calculator
bind=SUPER+CTRL,Q,spawn,omacalc
# Calculator
bind=NONE,XF86Calculator,spawn,omacalc

# Toggle top bar
bind=SUPER+SHIFT,space,spawn,omarchy-toggle-bar
# Background switcher
bind=SUPER+CTRL,space,spawn,omarchy-menu toggle background
# Theme menu
bind=SUPER+SHIFT+CTRL,space,spawn,omarchy-menu toggle theme
# Toggle window transparency
bind=SUPER,BackSpace,spawn,omarchy-mango-window-transparency-toggle
# Toggle window gaps
bind=SUPER+SHIFT,BackSpace,togglegaps

# Dismiss last notification
bind=SUPER,comma,spawn,omarchy-shell notifications dismissOne
# Dismiss all notifications
bind=SUPER+SHIFT,comma,spawn,omarchy-shell notifications dismissAll
# Toggle silencing notifications
bind=SUPER+CTRL,comma,spawn,omarchy-toggle-notification-silencing
# Invoke last notification
bind=SUPER+ALT,comma,spawn,omarchy-shell notifications invokeLast
# Open notification history
bind=SUPER+SHIFT+ALT,comma,spawn,omarchy-shell notifications showHistory

# Toggle locking on idle
bind=SUPER+CTRL,I,spawn,omarchy-toggle-idle
# Toggle nightlight
bind=SUPER+CTRL,N,spawn,omarchy-toggle-nightlight
# Toggle laptop display
bind=SUPER+CTRL,Delete,spawn,omarchy-mango-monitor-internal toggle
# Toggle laptop display mirroring
bind=SUPER+CTRL+ALT,Delete,spawn,omarchy-mango-monitor-internal-mirror toggle
switchbind=fold,spawn,omarchy-system-lid-close
switchbind=unfold,spawn,omarchy-mango-monitor-clamshell

# Screenshot
bind=NONE,Print,spawn,omarchy-capture-screenshot
# Screenrecording
bind=ALT,Print,spawn_shell,omarchy-capture-screenrecording --stop-recording || omarchy-menu toggle trigger.capture.screenrecord
# Make webcam overlay smaller
bind=SUPER+ALT,code:34,spawn,omarchy-capture-webcam-resize smaller
# Make webcam overlay larger
bind=SUPER+ALT,code:35,spawn,omarchy-capture-webcam-resize larger
# Color picker
bind=SUPER,Print,spawn_shell,pkill hyprpicker || hyprpicker -a
# Extract text (OCR) from screenshot
bind=SUPER+CTRL,Print,spawn,omarchy-capture-text

# Share
bind=SUPER+CTRL,S,spawn,omarchy-menu toggle share
# Transcode
bind=SUPER+CTRL,period,spawn,omarchy-transcode

# Set reminder
bind=SUPER+CTRL,R,spawn,omarchy-menu toggle reminder-set
# Show reminders
bind=SUPER+CTRL+ALT,R,spawn,omarchy-reminder show
# Clear reminders
bind=SUPER+SHIFT+CTRL,R,spawn,omarchy-reminder clear

# Show time
bind=SUPER+CTRL+ALT,T,spawn,omarchy-notification-time
# Show battery remaining
bind=SUPER+CTRL+ALT,B,spawn,omarchy-notification-battery
# Toggle weather
bind=SUPER+CTRL+ALT,W,spawn,omarchy-notification-weather

# Agent
bind=SUPER+SHIFT+CTRL,A,spawn,omarchy-agent --pick
# Audio
bind=SUPER+CTRL,A,spawn,omarchy-shell shell toggle omarchy.audio
# Bluetooth
bind=SUPER+CTRL,B,spawn,omarchy-shell shell toggle omarchy.bluetooth
# Display
bind=SUPER+CTRL,D,spawn,omarchy-shell shell toggle omarchy.monitor
# Calendar
bind=SUPER+CTRL+ALT,D,spawn,omarchy-shell shell toggle omarchy.clock
# Network
bind=SUPER+CTRL,W,spawn,omarchy-shell shell toggle omarchy.network
# Power
bind=SUPER+CTRL,P,spawn,omarchy-shell shell toggle omarchy.power
# Activity
bind=SUPER+CTRL,T,spawn,omarchy-launch-tui btop

# Bar panels by position: 1 is the leftmost panel in the bar's right section.
# Bar panel 1
bind=SUPER+CTRL,code:10,spawn,omarchy-shell -q shell togglePanelAt right 1
# Bar panel 2
bind=SUPER+CTRL,code:11,spawn,omarchy-shell -q shell togglePanelAt right 2
# Bar panel 3
bind=SUPER+CTRL,code:12,spawn,omarchy-shell -q shell togglePanelAt right 3
# Bar panel 4
bind=SUPER+CTRL,code:13,spawn,omarchy-shell -q shell togglePanelAt right 4
# Bar panel 5
bind=SUPER+CTRL,code:14,spawn,omarchy-shell -q shell togglePanelAt right 5
# Bar panel 6
bind=SUPER+CTRL,code:15,spawn,omarchy-shell -q shell togglePanelAt right 6
# Bar panel 7
bind=SUPER+CTRL,code:16,spawn,omarchy-shell -q shell togglePanelAt right 7
# Bar panel 8
bind=SUPER+CTRL,code:17,spawn,omarchy-shell -q shell togglePanelAt right 8
# Bar panel 9
bind=SUPER+CTRL,code:18,spawn,omarchy-shell -q shell togglePanelAt right 9

# Lock system
bind=SUPER+CTRL,L,spawn,omarchy-system-lock

# Keyboard control for the slurp region picker (omarchy-capture-region switches
# to this mode while its selection layer is up, and back when it closes).
key_mode=selection
bind=NONE,Return,spawn,omarchy-capture-region --take-window
bind=CTRL,Return,spawn,omarchy-capture-region --take-fullscreen
bind=NONE,Tab,spawn,omarchy-capture-region --select-window next
bind=CTRL,Tab,spawn,omarchy-capture-region --select-window prev
bind=NONE,Left,spawn,omarchy-capture-region --select-window left
bind=NONE,Right,spawn,omarchy-capture-region --select-window right
bind=NONE,Up,spawn,omarchy-capture-region --select-window up
bind=NONE,Down,spawn,omarchy-capture-region --select-window down
bindp=NONE,Escape,setkeymode,default
key_mode=default
