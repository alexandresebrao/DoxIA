# Omarchy mango defaults. Don't edit these: put overrides in ~/.config/mango.
#
# ~/.local/state/omarchy/mango/default links to $OMARCHY_PATH/default/mango
# (omarchy-mango-session keeps it current), because source= only expands ~.

source=~/.local/state/omarchy/mango/default/envs.conf
source=~/.local/state/omarchy/mango/default/looknfeel.conf
source=~/.local/state/omarchy/mango/default/input.conf
source=~/.local/state/omarchy/mango/default/windows.conf
source=~/.local/state/omarchy/mango/default/autostart.conf

# Bindings: default/mango/bindings/*.conf minus the keys your own files bind
# again, built by omarchy-mango-bindings (mango has no unbind). It runs on every
# reload and only rewrites the file when something changed.
exec=omarchy-mango-bindings
source_optional=~/.local/state/omarchy/mango/bindings.conf

# Current theme colors, then the theme's own look (corners, opacity, shadows,
# blur) when it ships a mango-looknfeel.conf.
source_optional=~/.local/state/omarchy/current/theme/mango.conf
source_optional=~/.local/state/omarchy/current/theme/mango-looknfeel.conf

# Lighter effects inside a VM (linked by omarchy-mango-session).
source_optional=~/.local/state/omarchy/mango/vm.conf
source_optional=~/.local/state/omarchy/mango/hyperv.conf
