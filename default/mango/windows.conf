# Window and layer rules. See docs/window-management/rules.md in mango.
# app_id and title are regexes; when a window matches several rules, later
# rules win for the options they set.

# Windows ignore the app's own maximize request.
window_rule=ignore_maximize:1,app_id:.*

# Floating dialogs and Omarchy's own small windows: 875x600, centered.
window_rule=is_floating:1,width:875,height:600,app_id:^(org\.omarchy\.btop|org\.omarchy\.terminal|org\.omarchy\.bash|org\.codeberg\.dnkl\.foot|org\.gnome\.NautilusPreviewer|org\.gnome\.Evince|Omarchy|About|TUI\.float|imv|mpv)$
window_rule=is_floating:1,width:875,height:600,app_id:^xdg-desktop-portal-gtk$
window_rule=is_floating:1,width:875,height:600,app_id:^(sublime_text|DesktopEditors|org\.gnome\.Nautilus)$,title:^(Open.*Files?|Open [Ff]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to (open|save).*|[Cc]hoose.*)
window_rule=is_floating:1,width:875,height:600,app_id:^(1[pP]assword|Bitwarden)$
window_rule=shield_when_capture:1,app_id:^(1[pP]assword|Bitwarden)$
window_rule=is_floating:1,width:875,height:600,shield_when_capture:1,app_id:chrome-nngceckbapebfimnlniiiahkandclblb-Default
window_rule=is_floating:1,width:875,height:600,app_id:^org\.doxia\.Painel$

# The About fastfetch layout needs more columns than the standard float.
window_rule=is_floating:1,width:920,height:480,app_id:^org\.omarchy\.about$
window_rule=is_floating:1,app_id:^(dev\.tensaku\.Tensaku|omacalc)$
window_rule=is_floating:1,width:1100,height:620,app_id:^org\.omarchy\.services-log$
# Painel Rápido (fedora/doxia/painel, SUPER+ALT+P).
window_rule=is_floating:1,app_id:^org\.doxia\.Painel$

# Fullscreen screensaver.
window_rule=is_floating:1,is_fullscreen:1,animation_type_open:slide,app_id:^org\.omarchy\.screensaver$

# Omarchy shell windows: the dev gallery opens maximized, Atualizar DoxIA floats.
window_rule=force_fake_maximize:1,app_id:^org\.quickshell$,title:^Omarchy shell – dev gallery$
window_rule=is_floating:1,width:560,height:620,app_id:^org\.quickshell$,title:^Atualizar DoxIA$

# Browsers: opaque while focused.
window_rule=focused_opacity:1.0,unfocused_opacity:0.985,app_id:((google-)?[cC]hrom(e|ium)|[bB]rave-browser|[mM]icrosoft-edge|Vivaldi-stable|helium|[fF]irefox|zen|librewolf)
# Video web apps stay fully opaque.
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:(^.+-youtube\.com__.*$|^.+-app\.zoom\.us__wc_home.*$)

# No transparency on media and colour-critical windows.
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(zoom|vlc|mpv|org\.kde\.kdenlive|com\.obsproject\.Studio|com\.github\.PintaProject\.Pinta|imv|org\.gnome\.NautilusPreviewer|qemu|com\.libretro\.RetroArch|steam.*)$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:.*[Rr]esolve.*

# Picture-in-picture: floating on every workspace, top right.
window_rule=is_floating:1,is_global:1,no_border:1,width:600,height:338,offset_x:90,offset_y:-88,focused_opacity:1.0,unfocused_opacity:1.0,title:(Picture.?in.?[Pp]icture)
# Google Meet PiP uses the meeting title.
window_rule=is_floating:1,is_global:1,no_border:1,width:600,height:338,offset_x:90,offset_y:88,focused_opacity:1.0,unfocused_opacity:1.0,app_id:((google-)?[cC]hrom(e|ium)|[mM]icrosoft-edge),title:^Meet - .+

# Webcam overlay: pinned to the bottom-right corner, never focused on open.
window_rule=is_floating:1,is_global:1,is_open_silent:1,no_border:1,width:0.16,height:0.32,offset_x:90,offset_y:85,focused_opacity:1.0,unfocused_opacity:1.0,app_id:^WebcamOverlay-small$
window_rule=is_floating:1,is_global:1,is_open_silent:1,no_border:1,width:0.22,height:0.44,offset_x:88,offset_y:80,focused_opacity:1.0,unfocused_opacity:1.0,app_id:^WebcamOverlay-medium$
window_rule=is_floating:1,is_global:1,is_open_silent:1,no_border:1,width:0.30,height:0.60,offset_x:84,offset_y:70,focused_opacity:1.0,unfocused_opacity:1.0,app_id:^WebcamOverlay-large$

# DaVinci Resolve floats; its main window goes fullscreen.
window_rule=is_floating:1,app_id:.*[Rr]esolve.*
window_rule=is_fullscreen:1,app_id:.*[Rr]esolve.*,title:^DaVinci Resolve( Studio)? - .+$

# LocalSend.
window_rule=is_floating:1,width:1100,height:700,app_id:^(localsend|localsend_app)$

# Games and launchers.
window_rule=is_floating:1,app_id:^steam$
window_rule=is_floating:1,width:1100,height:700,app_id:^steam$,title:^Steam$
window_rule=is_floating:1,width:460,height:800,app_id:^steam$,title:^Friends List$
window_rule=is_fullscreen:1,idle_inhibit_when_focus:1,app_id:^(com\.moonlight_stream\.Moonlight|com\.libretro\.RetroArch)$
window_rule=idle_inhibit_when_focus:1,app_id:GeForceNOW
window_rule=is_floating:1,width:1280,height:800,app_id:^steam_app_battlenet$,title:^Battle\.net$
window_rule=no_border:1,no_shadow:1,no_blur:1,app_id:^steam_app_battlenet$,title:^Battle\.net Setup$

# Hermes HUD manages its own geometry.
window_rule=is_floating:1,no_border:1,focused_opacity:1.0,unfocused_opacity:1.0,app_id:^Hermes$,title:^Hermes HUD$

# Telegram must not steal focus on new messages.
window_rule=is_open_silent:1,app_id:^org\.telegram\.desktop$

# Chrome's "... is sharing your screen" bar goes to the hidden special tag;
# the bar's screenshare indicator stops sharing instead.
window_rule=tags:0,is_open_silent:1,no_animation:1,title:.*(está compartilhando|is sharing) .*

# Xwayland video bridge: an invisible helper window.
window_rule=is_floating:1,is_open_silent:1,no_border:1,no_animation:1,width:1,height:1,focused_opacity:0.0,unfocused_opacity:0.0,app_id:^xwaylandvideobridge$


# Layer surfaces from the Omarchy shell pop without compositor animation.
layer_rule=no_animation:1,layer_name:^(omarchy-bar|omarchy-menu|omarchy-image-selector|omarchy-emojis|omarchy-clipboard|omarchy-keyboard-panel)$
# slurp's region picker: no animation or blur in the screenshot.
layer_rule=no_animation:1,no_blur:1,no_shadow:1,layer_name:^selection$
