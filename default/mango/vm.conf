# In a VM mango renders on llvmpipe, where a theme's 3-pass blur makes everything
# sluggish: one short pass still gives the frosted look. omarchy-mango-session
# links this in only inside a VM; it never turns blur or shadows on by itself.
blur_params_radius=4
blur_params_num_passes=1
blur_params_noise=0
shadows_size=10
