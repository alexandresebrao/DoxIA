# In a VM mango renders on llvmpipe, where a theme's 3-pass blur makes everything
# sluggish: one short pass still gives the frosted look. omarchy-mango-session
# links this in only inside a VM; it never turns blur or shadows on by itself.
blur_params_radius=4
blur_params_num_passes=1
blur_params_noise=0
shadows_size=10

# On VMware, vmware-user (open-vm-tools) maps invisible X11 helper windows
# (clipboard / drag and drop) at login; mango would tile them with a focus
# border for about a second. Float them tiny in a corner, unfocused, fully
# transparent.
window_rule=is_floating:1,no_size_hint:1,width:10,height:10,offset_x:999,offset_y:999,no_border:1,no_shadow:1,no_animation:1,no_fade_in:1,no_fade_out:1,is_open_silent:1,focused_opacity:0,unfocused_opacity:0,app_id:^vmware-user$

# The Windows host takes Win+L (lock screen) before VMware sees it, so
# SUPER+L never reaches mango. SUPER+Ç, next to L on ABNT2, switches the
# layout instead.
bind=SUPER,ccedilla,switch_layout
