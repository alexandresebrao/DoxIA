# Minimal mango config for the login screen (default/greetd/doxia-greeter-session),
# which starts doxia-greeter in it and quits mango when the greeter exits.
#
# No bind= lines on purpose: nothing at the login screen may spawn a program.
# mango only adds its built-in Ctrl+Alt+F1..F12 VT switches.

# The greeter draws on layer surfaces; nothing else ever opens here.
border_px=0
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0

animations=0
layer_animations=0
blur=0
shadows=0

root_color=0x000000ff
cursor_size=24
