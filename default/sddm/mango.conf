# Minimal mango config for the SDDM Wayland greeter (default/sddm/doxia-greeter).
# SDDM starts the greeter itself once the compositor is up.
#
# No bind= lines on purpose: nothing at the login screen may spawn a program.
# mango only adds its built-in Ctrl+Alt+F1..F12 VT switches.

# The greeter is the only window: let it cover the whole output.
border_px=0
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0

animations=0
layer_animations=0
blur=0
shadows=0

root_color=0x000000ff
cursor_size=24
