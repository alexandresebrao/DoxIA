# LiquidOceanIA no mango: vidro líquido claro. Cantos arredondados, blur atrás de
# janelas e da casca translúcida (barra, menus, notificações) e um brilho azul suave na
# janela ativa. Carregado depois das cores (mango.conf); a borda ativa usa a primeira cor
# do gradiente, que o mango não desenha.

border_radius=14

focused_opacity=0.97
unfocused_opacity=0.9

shadows=1
shadow_only_floating=0
shadows_size=16
shadows_blur=16
shadows_color=0x1f7ae02e

blur=1
blur_optimized=1
blur_params_radius=9
blur_params_num_passes=3
blur_params_noise=0.02
blur_params_contrast=1.0
blur_params_brightness=1.0
blur_params_saturation=1.15

# A casca do Omarchy é layer-shell: blur atrás dela, e só dela.
blur_layer=1
layer_rule=layer_name:^(?!omarchy-(bar|menu|notifications|osd|clipboard|emojis|keyboard-panel|polkit|reminders|network-qr)$),no_blur:1
